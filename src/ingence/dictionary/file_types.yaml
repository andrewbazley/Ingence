     extensions: [mtx, h5ad, loom, rds_matrix, anndata], category: general, can_be_raw: no,
     domains: [sequencing]}
  - {name: capillary sequencing trace, family: capillary_trace, extensions: [ab1],
     category: instrument, can_be_raw: yes, domains: [sequencing]}
  - {name: provider sequence text, family: sequence_text, extensions: [seq], category: general,
     can_be_raw: no, domains: [sequencing], media_type: text/plain, also_a_word: [seq]}

  # ---------------------------------------------------------------------------------------
  # Spectrometry and plate readers.
  # ---------------------------------------------------------------------------------------
  # `raw_ms` is a placeholder spelling (a bare `.raw` is the core's binary data); `d_folder`
  # stands for a vendor's `.d` folder, which the census reads as a folder.
  - {name: mass spectrometer data, family: ms_format, extensions: [raw_ms], category: instrument,
     can_be_raw: yes, domains: [spectrometry]}
  - {name: open mass spectrometry data, family: ms_format, extensions: [mzml, mzxml],
     category: general, can_be_raw: evidence, domains: [spectrometry], media_type: application/xml}
  - {name: peak list, family: ms_format, extensions: [mgf], category: general,
     can_be_raw: evidence, domains: [spectrometry], media_type: text/plain}
  - {name: identification results, family: ms_format, extensions: [mzid], category: general,
     can_be_raw: no, domains: [spectrometry], media_type: application/xml}
  - {name: SCIEX data, family: ms_format, extensions: [wiff], category: instrument,
     can_be_raw: yes, domains: [spectrometry]}
  - {name: vendor data folder placeholder, family: ms_format, extensions: [d_folder],
     category: instrument, can_be_raw: yes, domains: [spectrometry]}
  - {name: search results, family: ms_format, extensions: [pepxml, protxml], category: general,
     can_be_raw: no, domains: [spectrometry], media_type: application/xml}
  # Gen5's protocol file, after a dot only (`.prt` is a CAD part file elsewhere); written by
  # the software, not by the reader as it reads.
  - {name: plate reader protocol, family: plate_reader_protocol, extensions: [prt],
     category: general, can_be_raw: no, domains: [spectrometry], writers: [Gen5],
     also_a_word: all, written_by: software, vendor: Agilent BioTek Gen5}

# ---------------------------------------------------------------------------------------
# Writers: the programs found in a file's tags or headers (a TIFF's Software tag, an OME
# Creator, an ImageJ description), each marked acquisition (the file is recorded data),
# analysis (derived from something) or figure. `spellings` are how the program names itself
# in a tag, matched without regard to case.
# ---------------------------------------------------------------------------------------
writers:
  - {name: NIS-Elements, kind: acquisition, vendor: Nikon, spellings: [nis-elements, nis elements]}
  # `lsm` is the name the TIFF reader gives Zeiss's LSM private tag: the acquisition software's.
  - {name: ZEN, kind: acquisition, vendor: Zeiss, spellings: [zen, zen blue, zen black, lsm]}
  - {name: LAS X, kind: acquisition, vendor: Leica, spellings: [las x, lasx, las af]}
  - {name: Gen5, kind: acquisition, vendor: Agilent BioTek, spellings: [gen5]}
  - {name: Micro-Manager, kind: acquisition, spellings: [micro-manager, micromanager]}
  - {name: MetaMorph, kind: acquisition, vendor: Molecular Devices, spellings: [metamorph]}
  - {name: cellSens, kind: acquisition, vendor: Olympus, spellings: [cellsens]}
  - {name: FluoView, kind: acquisition, vendor: Olympus, spellings: [fluoview, fv10, fv31]}
  - {name: pCLAMP, kind: acquisition, vendor: Molecular Devices, spellings: [pclamp, clampex]}
  - {name: Imaris, kind: analysis, vendor: Oxford Instruments, spellings: [imaris]}
  - {name: ImageJ, kind: analysis, spellings: [imagej]}
  - {name: Fiji, kind: analysis, spellings: [fiji]}
  - {name: Photoshop, kind: figure, vendor: Adobe, spellings: [photoshop]}
  - {name: Illustrator, kind: figure, vendor: Adobe, spellings: [illustrator]}

# ---------------------------------------------------------------------------------------
# Instruments: names a laboratory folder is called after. Read only to guess that an area
# is named for an instrument (the areas page's kind); never a word of the Dictionary.
# ---------------------------------------------------------------------------------------
instruments:
  - {name: Cytation, vendor: Agilent BioTek, kind: plate imager, spellings: [cytation]}
  - {name: EVOS, vendor: Thermo Fisher, kind: microscope, spellings: [evos]}
  - {name: Nikon, kind: microscope, spellings: [nikon]}
  - {name: Zeiss, kind: microscope, spellings: [zeiss]}
  - {name: Leica, kind: microscope, spellings: [leica]}
  - {name: Olympus, kind: microscope, spellings: [olympus]}
  - {name: Keyence, kind: microscope, spellings: [keyence]}
  - {name: Incucyte, vendor: Sartorius, kind: live-cell imager, spellings: [incucyte]}
  - {name: Hamamatsu, kind: slide scanner, spellings: [hamamatsu]}
  - {name: Aperio, vendor: Leica, kind: slide scanner, spellings: [aperio]}
  - {name: DeltaVision, vendor: Applied Precision, kind: microscope, spellings: [deltavision]}
  # `ambiguous`: a spelling that is also an ordinary word; a folder named that word alone is
  # not the instrument's.
  - {name: Axon, vendor: Molecular Devices, kind: amplifier, spellings: [axon, digidata],
     ambiguous: true}

# ---------------------------------------------------------------------------------------
# Identifiers: public archives' accessions, kept whole by the tokeniser and never asked about
# as words. Each pattern matches a whole chunk of a name; a hyphen inside a pattern is the
# identifier's own and does not divide it.
# ---------------------------------------------------------------------------------------
identifiers:
  - {name: ENCODE accession, pattern: 'ENC[A-Z]{2}\d{3}[A-Z]{3}'}
  - {name: GEO series or sample, pattern: 'GS[EM]\d+'}
  - {name: GEO platform, pattern: 'GPL\d+'}
  - {name: "SRA or ENA run, experiment, sample or study", pattern: '[SED]R[RXSP]\d+'}
  - {name: BioProject, pattern: 'PRJ[NED][A-Z]\d+'}
  - {name: EMPIAR entry, pattern: 'EMPIAR-\d+'}
  - {name: BioImage Archive study, pattern: 'S-BIAD\d+'}
