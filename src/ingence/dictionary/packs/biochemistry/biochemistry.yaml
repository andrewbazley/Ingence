# Molecular and cell biology, biochemistry.
#
# The broadest domain section, because its vocabulary is shared by almost every wet laboratory
# whatever they study. It holds reagent classes, technique names and the public scientific
# vocabulary that laboratories share: a widely used cell line, drug, reagent or protein, each taken
# from a public source and carrying its identifier. Never a person, a private construct or strain
# name, a project code, an internal abbreviation or a date.

# The pack's manifest. Its digest is over the words below, not the comments: a changed word needs a
# new version and a new digest.
pack:
  name: biochemistry
  version: "3"
  domain: biochemistry
  author: Ingence
  licence: MIT
  schema: "1.22"
  digest: 6d106581d1730883eda17200703093a3
section: biochemistry
theme_kind: technique
origin: builtin
domain: biochemistry
# The pack's file formats are rows of the file-type table
# (`src/ingence/dictionary/file_types.yaml`), every row naming this section. The senses are the ones
# this file declared, term for term and spelling for spelling, so nothing made from them moves. What
# each format is, who writes it and whether it is recorded data is the table's.
file_types: from_table
summary: Wet-laboratory techniques, reagent classes, cell culture and genetics.

