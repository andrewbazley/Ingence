  # -- common public biology ------------------------------------------------
  # Common, public scientific vocabulary ships in the pack where each word belongs. It covers public
  # scientific terms only: never a person, a private construct or strain name, a project code, an
  # internal abbreviation or a date. Every entry here is taken from a public source, and its
  # accession is in `ontology_ids`: Cellosaurus for a cell line, ChEBI and PubChem for a compound,
  # UniProt for a protein, FPbase for a fluorescent protein. A word with no accession (a tag, a
  # signal, a promoter) names its public page in the comment above it (Wikipedia). Each cell line,
  # drug and protein is a sense of its own, as the core's ATP and ADP are, so two names holding two
  # of them stay two conditions. A short spelling that a laboratory may mean otherwise is not
  # shipped bare: `tg` is also transgenic, `myc` the gene, `cmv` the virus, `cck` an assay kit,
  # `ubc` a university and `cho` a surname. The entry spells the long form, and a laboratory that
  # means the short one adds it to its own pack.

  # Cell lines (Cellosaurus). A cell line is the subject of a culture, as an organism is.
  - {term: hela, canonical: HeLa, theme_kind: subject, surfaces: [hela],
     ontology_ids: ["Cellosaurus:CVCL_0030"]}
  # HEK293 and its large-T derivative 293T are two lines in Cellosaurus (CVCL_0045, CVCL_0063); they
  # are one sense here. `293T` alone is not spelled: `293 t` also reads a plate numbered 293.
  - {term: hek293, canonical: HEK293, theme_kind: subject,
     surfaces: ["hek 293", "hek 293t"],
     ontology_ids: ["Cellosaurus:CVCL_0045", "Cellosaurus:CVCL_0063"]}
  - {term: u2os, canonical: U2OS, theme_kind: subject, surfaces: [u2os, "u 2 os", u20s],
     ontology_ids: ["Cellosaurus:CVCL_0042"]}
  - {term: cos7, canonical: COS-7, theme_kind: subject, surfaces: ["cos 7", cos7],
     ontology_ids: ["Cellosaurus:CVCL_0224"]}
  # CHO-K1 is a line of its own in Cellosaurus (CVCL_0214), one sense with CHO here.
  - {term: cho, canonical: CHO, theme_kind: subject,
     surfaces: ["chinese hamster ovary", "cho cell", "cho k1"],
     ontology_ids: ["Cellosaurus:CVCL_0213", "Cellosaurus:CVCL_0214"]}

