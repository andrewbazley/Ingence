  # -- model organisms, by their binomial and their short forms -------------
  # Shared by every laboratory that works on one, so a species ships where a strain never does. Each
  # binomial and its abbreviated genus is spelled in parts, so it binds across an underscore, a
  # hyphen, a space or a dot (`E. coli`, `E_coli`) or written flush (`Ecoli`), and only with its
  # words adjacent and in order; a common name, and a genus or species word used alone for the
  # organism, are spelled whole. `yeast` alone is left out: it names the budding and the fission
  # yeast alike. `fly`, `worm` and `human` are left out too, because they are too often other words
  # (a fly-through, a worm gear, a human annotation).
  - {term: escherichia_coli, canonical: Escherichia coli, theme_kind: subject,
     surfaces: ["escherichia coli", "e coli"]}
  - {term: saccharomyces_cerevisiae, canonical: Saccharomyces cerevisiae, theme_kind: subject,
     surfaces: ["saccharomyces cerevisiae", "s cerevisiae", cerevisiae, "budding yeast"]}
  - {term: schizosaccharomyces_pombe, canonical: Schizosaccharomyces pombe, theme_kind: subject,
     surfaces: ["schizosaccharomyces pombe", "s pombe", pombe, "fission yeast"]}
