  - {term: megabyte, surfaces: [MB, megabyte], dimension: digital_size, base: byte, factor: 1.0e6, ucum: MBy}
  - {term: gigabyte, surfaces: [GB, gigabyte], dimension: digital_size, base: byte, factor: 1.0e9, ucum: GBy}
