  - {term: millilitre, surfaces: [mL, ml, millilitre, milliliter, cc], dimension: volume, base: litre, factor: 0.001, ucum: mL}
  - {term: microlitre, surfaces: [uL, ul, µL, µl, μL, microlitre, microliter], dimension: volume, base: litre, factor: 1.0e-6, ucum: uL}
  - {term: nanolitre, surfaces: [nL, nl, nanolitre, nanoliter], dimension: volume, base: litre, factor: 1.0e-9, ucum: nL}
  - {term: picolitre, surfaces: [pL, pl, picolitre, picoliter], dimension: volume, base: litre, factor: 1.0e-12, ucum: pL}

  # -- time -----------------------------------------------------------------
  - {term: second, surfaces: [s, sec, secs, second, seconds], dimension: time, base: second, factor: 1.0, ucum: s}
  - {term: millisecond, surfaces: [ms, msec, millisecond, milliseconds], dimension: time, base: second, factor: 0.001, ucum: ms}
  - {term: microsecond, surfaces: [us, µs, μs, usec, microsecond], dimension: time, base: second, factor: 1.0e-6, ucum: us}
  - {term: nanosecond, surfaces: [ns, nsec, nanosecond], dimension: time, base: second, factor: 1.0e-9, ucum: ns}
  - {term: minute, surfaces: [min, mins, minute, minutes], dimension: time, base: second, factor: 60.0, ucum: min}
  - {term: hour, surfaces: [h, hr, hrs, hour, hours], dimension: time, base: second, factor: 3600.0, ucum: h}
  # dpi and dpf are days post infection and days post fertilisation. They also
  # spell dots per inch, and nothing about the token distinguishes them.
  - {term: day, surfaces: [d, day, days, dpi, dpf], dimension: time, base: second, factor: 86400.0,
   ambiguous_with: [dots_per_inch], ucum: d}
  - {term: week, surfaces: [wk, week, weeks], dimension: time, base: second, factor: 604800.0, ucum: wk}
  - {term: month, surfaces: [mo, month, months], dimension: time, base: second, factor: 2629800.0, ucum: mo}
  - {term: year, surfaces: [y, yr, year, years], dimension: time, base: second, factor: 31557600.0, ucum: a}

  # -- temperature ----------------------------------------------------------
  # The only dimension needing an offset, which is why the field exists.
  - {term: celsius, surfaces: [C, degC, '°C', celsius, centigrade], dimension: temperature, base: kelvin, factor: 1.0, offset: 273.15, ucum: Cel}
  - {term: kelvin, surfaces: [K, kelvin], dimension: temperature, base: kelvin, factor: 1.0, ucum: K}
  # Bare F dropped: the farad owns that symbol unambiguously.
  - {term: fahrenheit, surfaces: [degF, '°F', fahrenheit], dimension: temperature, base: kelvin, factor: 0.5555555555555556, offset: 255.3722222222222, ucum: '[degF]'}

