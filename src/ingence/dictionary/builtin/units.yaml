# Units and dimensions.
#
# Two consumers read this file. The Dictionary learns that "nM" denotes a
# concentration; the normaliser learns that it is 1e-9 of the base unit, so that
# "500nM", "500 nM" and "0.5 uM" reduce to one comparable quantity. Keeping both
# in one file means a unit cannot be known to one and unknown to the other.
#
# `factor` converts to the dimension's base unit, named in `base`. Where a unit
# is not a simple multiple, `offset` applies after scaling, which is what
# temperature needs and nothing else does.
#
# Exhaustiveness is free here. An entry that never fires costs a few bytes and
# is never seen; an entry that is missing costs a quantity nobody can compare.
section: units
theme_kind: unit
origin: builtin
summary: SI and common non-SI units, with the conversions that make them comparable.

entries:
  # -- length ---------------------------------------------------------------
  - {term: metre, surfaces: [m, metre, metres, meter, meters], dimension: length, base: metre, factor: 1.0, ucum: m}
  - {term: kilometre, surfaces: [km, kilometre, kilometer], dimension: length, base: metre, factor: 1000.0, ucum: km}
  - {term: centimetre, surfaces: [cm, centimetre, centimeter], dimension: length, base: metre, factor: 0.01, ucum: cm}
  - {term: millimetre, surfaces: [mm, millimetre, millimeter], dimension: length, base: metre, factor: 0.001, ucum: mm}
  - {term: micrometre, surfaces: [um, µm, μm, micron, microns, micrometre, micrometer], dimension: length, base: metre, factor: 1.0e-6, ucum: um}
  - {term: nanometre, surfaces: [nm, nanometre, nanometer], dimension: length, base: metre, factor: 1.0e-9, ucum: nm}
  - {term: picometre, surfaces: [pm, picometre, picometer], dimension: length, base: metre, factor: 1.0e-12, ucum: pm}
  # Bare A dropped: it is also the ampere, and the angstrom has its own symbol.
  - {term: angstrom, surfaces: [Å, angstrom, angstroms], dimension: length, base: metre, factor: 1.0e-10, ucum: Ao}
  - {term: inch, surfaces: [in, inch, inches, '"'], dimension: length, base: metre, factor: 0.0254, ucum: '[in_i]'}
  - {term: foot, surfaces: [ft, foot, feet], dimension: length, base: metre, factor: 0.3048, ucum: '[ft_i]'}

