  - {term: kilogram, surfaces: [kg, kilogram, kilograms], dimension: mass, base: gram, factor: 1000.0, ucum: kg}
  - {term: milligram, surfaces: [mg, milligram, milligrams], dimension: mass, base: gram, factor: 0.001, ucum: mg}
  - {term: microgram, surfaces: [ug, µg, μg, mcg, microgram, micrograms], dimension: mass, base: gram, factor: 1.0e-6, ucum: ug}
  - {term: nanogram, surfaces: [ng, nanogram, nanograms], dimension: mass, base: gram, factor: 1.0e-9, ucum: ng}
  - {term: picogram, surfaces: [pg, picogram, picograms], dimension: mass, base: gram, factor: 1.0e-12, ucum: pg}
  - {term: femtogram, surfaces: [fg, femtogram], dimension: mass, base: gram, factor: 1.0e-15, ucum: fg}
  - {term: dalton, surfaces: [Da, dalton, daltons, amu], dimension: molecular_mass, base: dalton, factor: 1.0, ucum: u}
  - {term: kilodalton, surfaces: [kDa, kilodalton], dimension: molecular_mass, base: dalton, factor: 1000.0, ucum: ku}
  - {term: megadalton, surfaces: [MDa, megadalton], dimension: molecular_mass, base: dalton, factor: 1.0e6, ucum: Mu}

  # -- volume ---------------------------------------------------------------
