  # inconsistent spelling costs the most.
  - {term: molar, surfaces: [M, molar, mol/L, mol/l], dimension: concentration, base: molar, factor: 1.0, ucum: mol/L}
  - {term: millimolar, surfaces: [mM, millimolar, mmol/L], dimension: concentration, base: molar, factor: 0.001, ucum: mmol/L}
  - {term: micromolar, surfaces: [uM, µM, μM, micromolar, umol/L], dimension: concentration, base: molar, factor: 1.0e-6, ucum: umol/L}
  - {term: nanomolar, surfaces: [nM, nanomolar, nmol/L], dimension: concentration, base: molar, factor: 1.0e-9, ucum: nmol/L}
  - {term: picomolar, surfaces: [pM, picomolar, pmol/L], dimension: concentration, base: molar, factor: 1.0e-12, ucum: pmol/L}
  - {term: femtomolar, surfaces: [fM, femtomolar], dimension: concentration, base: molar, factor: 1.0e-15, ucum: fmol/L}
  - {term: milligram_per_millilitre, surfaces: [mg/mL, mg/ml, mgml, mgpermL], dimension: mass_concentration, base: gram_per_litre, factor: 1.0, ucum: mg/mL}
  - {term: microgram_per_millilitre, surfaces: [ug/mL, µg/mL, μg/mL, ugml, ugperml], dimension: mass_concentration, base: gram_per_litre, factor: 0.001, ucum: ug/mL}
  - {term: nanogram_per_millilitre, surfaces: [ng/mL, ng/ml, ngml, ngperml], dimension: mass_concentration, base: gram_per_litre, factor: 1.0e-6, ucum: ng/mL}
  - {term: microgram_per_microlitre, surfaces: [ug/uL, µg/µL, ugul], dimension: mass_concentration, base: gram_per_litre, factor: 1.0, ucum: ug/uL}
  - {term: percent, surfaces: ['%', pct, percent], dimension: fraction, base: fraction, factor: 0.01, ucum: '%'}
  - {term: percent_weight_volume, surfaces: ['%w/v', 'wv', 'w/v'], dimension: fraction, base: fraction, factor: 0.01}
  - {term: percent_volume_volume, surfaces: ['%v/v', 'vv', 'v/v'], dimension: fraction, base: fraction, factor: 0.01}
  - {term: parts_per_million, surfaces: [ppm], dimension: fraction, base: fraction, factor: 1.0e-6, ucum: '[ppm]'}
  - {term: parts_per_billion, surfaces: [ppb], dimension: fraction, base: fraction, factor: 1.0e-9, ucum: '[ppb]'}
  # "10x" is ten-fold or ten times magnification, and only context decides.
  - {term: fold, surfaces: [x, X, fold, '-fold'], dimension: multiple, base: fold, factor: 1.0,
   ambiguous_with: [magnification]}

