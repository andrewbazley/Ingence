  - {term: millimole, surfaces: [mmol, millimole], dimension: amount, base: mole, factor: 0.001, ucum: mmol}
  - {term: micromole, surfaces: [umol, µmol, μmol, micromole], dimension: amount, base: mole, factor: 1.0e-6, ucum: umol}
  - {term: nanomole, surfaces: [nmol, nanomole], dimension: amount, base: mole, factor: 1.0e-9, ucum: nmol}
  - {term: picomole, surfaces: [pmol, picomole], dimension: amount, base: mole, factor: 1.0e-12, ucum: pmol}
  - {term: femtomole, surfaces: [fmol, femtomole], dimension: amount, base: mole, factor: 1.0e-15, ucum: fmol}

  # -- concentration --------------------------------------------------------
