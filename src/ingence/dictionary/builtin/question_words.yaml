# The words a question is asked with, and a name is not.
#
# "Does kelt change zib in vorn cells?": `does`, `change` and `in` say that a question is being
# asked and how its parts relate. `kelt`, `zib` and `vorn` are what it is about. Bound here, a
# question word is known to the search and dropped from a question before it is answered. It takes
# none of the twelve words a search reads, and it is never shown as a word the run is missing. A
# rule reads no question word as a subject, and a card shows none as a chip.
#
# Words that a unit, a date, a stage or a connective already spells are left out (`in`, `on`,
# `than`, `results`, `done`). So are the words that the shipped Dictionary binds to something else
# (`change` is a statistic's word, `experiment` a process's). A test checks that no entry here
# collides with another section. Plain English words that stand in names (`find`, `use`, `files`)
# are left out too, so that no reading of a name changes.
# `binds: false`: these spellings never bind a word in a name. The section is kept aside from the
# binder, the themes, the lattice and the design grid. Only the search reads it, so a name holding
# `me_is_it_2024` binds nothing new.
section: question_words
theme_kind: question
origin: builtin
binds: false
summary: The words a question is asked with, known so that a search drops them and never asks about them.

entries:
  - {term: how, surfaces: [how]}
  - {term: does, surfaces: [does, do, did]}
