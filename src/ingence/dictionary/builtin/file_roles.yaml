# What a file is *for*, independent of its format.
#
# A PDF can be a manuscript, a protocol, a figure or a receipt, and the format
# says nothing about which. This section names the roles, which is what lets a
# rule treat a protocol differently from a figure without either being a
# different file type.
section: file_roles
theme_kind: file_role
origin: builtin
summary: The purpose a file serves, independent of its format.

entries:
  - {term: readme, surfaces: [readme, "read-me", aboutthis, about]}
