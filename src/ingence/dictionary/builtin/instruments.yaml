# Instruments and hardware, named generically.
#
# Deliberately free of vendor model numbers. A model name is a fact about one
# laboratory's purchasing history, and a shipped dictionary full of them would be
# noise for everyone else. What generalises is the *kind* of instrument, and a
# user who wants their own model recognised adds one entry.
section: instruments
theme_kind: instrument
origin: builtin
summary: Kinds of laboratory and computing hardware, without vendor specifics.

entries:
