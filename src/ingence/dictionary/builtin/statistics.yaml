# Statistical and analytical vocabulary.
#
# Shared by every quantitative field, which makes it one of the highest-value
# domain-neutral sections: a column called "sd" means the same thing whether the
# study is about cells or climate.
section: statistics
theme_kind: statistic
origin: builtin
summary: Descriptive statistics, tests, models and evaluation measures.

entries:
  # -- descriptive ----------------------------------------------------------
  - {term: mean, surfaces: [mean, avg, ave, average, mu]}
  - {term: median, surfaces: [median, med, p50]}
  - {term: mode, surfaces: [mode]}
  - {term: standard_deviation, surfaces: [sd, std, stdev, stddev, sigma]}
  - {term: standard_error, surfaces: [se, sem, stderr]}
  - {term: variance, surfaces: [var, variance]}
  - {term: coefficient_of_variation, surfaces: [cv, "coefficient-of-variation"]}
  - {term: interquartile_range, surfaces: [iqr]}
  - {term: quartile, surfaces: [q1, q3, quartile, quartiles]}
  - {term: percentile, surfaces: [pct, percentile, quantile, p95, p99]}
  - {term: minimum, surfaces: [min, minimum, lowest]}
  - {term: maximum, surfaces: [max, maximum, highest, peak]}
  - {term: range, surfaces: [range, spread]}
  - {term: sum, surfaces: [sum, total, integral, integrated, auc_area]}
  # `n` is also `stated_replicate_count` in time_and_versions, on the kind `count`. The
  # collision is declared from both sides so that neither reads as an accident.
  - {term: count, surfaces: [n, count, counts, number, freq, frequency, tally],
     ambiguous_with: [stated_replicate_count]}

