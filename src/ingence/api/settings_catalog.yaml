read_by:
  dictionary.record_name_shapes:
    - predicate: same_component_values
      when_parameter: ordered_component_kinds
# What each choice of an enumerated setting does, in a person's words. A choice shown as its stored
# value could say the opposite of what it did. The file is keyed by the stored value as JSON
# ("null", "false", "\"always\"" is written always). The page offers the choices in this order,
# with the stored value on hover. A value given no words (~) is read as another and is not
# offered. The page shows it only where a file already holds it.
choices:
  depth:
    "metadata": "Quick: names, sizes and dates only"
    "standard": "Standard: also a sample of each file type's contents"
    "deep": "Deep: more of every file, small files compared whole, with a time limit"
  hash.skip_remote_filesystems:
    "null": "left to the depth"
    "false": "hash network drives too"
    "always": "never hash on a network drive"
    "true": ~
  hash.mode:
    "need": "only what comparing needs"
    "none": "nothing"
    "quick": "a sample of every file"
    "adaptive": "whole files below a size, a sample above"
    "full": "every file whole"
  hash.need_from:
    "comparison": "what comparing files needs"
    "depth": "what the reading depth names"
  dictionary.case_reading.unknown_whole:
    "whole": "one unknown word, asked about"
    "pieces": "its known pieces"
  dictionary.date_series:
    "settle": "sibling dates settle it"
    "off": "a dated folder alone"
  dictionary.domain_packs:
    "all": "every domain pack"
    "named": "only the packs named"
  dictionary.glued_runs:
    "letter_led": "one word if it starts with a letter"
    "whole": "always one word"
    "split": "letters and numbers apart"
  dictionary.glued_words.reading:
    "divide": "divided into its two words"
    "whole": "one word"
  dictionary.six_digit_dates:
    "year_first": "a date, year first"
    "none": "a number"
  groups.words_as:
    "terms": "its Dictionary term, so spellings called one thing are one word"
    "spellings": "the spelling the name wrote"
  themes.chance_null:
    "nearest_ten": "each shuffled experiment's ten nearest"
    "matched": "as many as the graph joins; the single nearest for placement"
  themes.final_placement:
    "medoid": "the seed most like the others"
    "first": "seed 0"
  themes.label_method:
    "tfidf": "TF-IDF"
    "log_odds": "log-odds against the rest"
  extraction.beneath_programs:
    "read_last": "after everything else"
    "not_read": "never"
    "read_in_turn": "in turn, like any file"
  extraction.spend_order:
    "family_round_robin": "file types in turn"
    "extension_round_robin": "extensions in turn"
    "smallest_first": "smallest first"
    "series_first": "one file of every series first"
  infer.streaming:
    "never": "all at once"
    "auto": "folder by folder when memory needs it"
    "always": "always folder by folder"
  jobs.executor:
    "subprocess": "a program of its own"
    "thread": "inside the Dashboard"
  listing.declared_links:
    "withheld": "held back, for scoring"
    "recorded": "scanned"
