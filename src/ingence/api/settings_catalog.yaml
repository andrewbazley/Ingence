  design.merge_parts: "Whether two parts of a name that always go together, such as GFP and 488, are drawn as one factor"
  dictionary.bind_terms: "Whether the Dictionary is asked what each part of a name means"
  dictionary.burst_gap_factor: "How many times longer than nearby pauses a pause must be to end a burst"
  dictionary.burst_gap_window: "How many neighboring pauses the typical pause is judged against"
  dictionary.case_reading.enabled: "Whether spellings joined at a capital are read by evidence, rather than always as pieces"
  dictionary.case_reading.unknown_whole: "For a one-word spelling the Dictionary lacks: treat it as unknown, or read its known pieces"
  dictionary.case_reading.whole_over_alone: "How often a joined spelling must appear, against its rarest piece alone, to be one word"
  dictionary.characterise_organisation: "Whether each folder's name patterns, time span and bursts of activity are described"
  dictionary.date_series: "Whether sibling short dates together settle an ambiguous day, month and year order"
  dictionary.domain_packs: "Not read since 0.4.0: Ingence reads every word list. Kept so old projects load"
