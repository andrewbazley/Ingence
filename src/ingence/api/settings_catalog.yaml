  dictionary.years: "The years a date in a name may fall in, first to last or the present"
  extraction.adapters: "Which file readers may run; empty allows every available one"
  extraction.beneath_programs: "When files inside installed programs are read: after everything else, never, or in turn"
  extraction.byte_scan_sections: "Dictionary sections whose words are searched for inside file contents; empty means none"
  extraction.clock_only_extensions: "File extensions read only for their timestamp when the ND2 clock-only option is on"
  extraction.deepening_budget_seconds: "Total time Ingence may spend reading file contents in one scan; the reading depth sets it"
