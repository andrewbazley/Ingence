# What each setting is for: each row gives the setting's name and its purpose in plain words. The
# file has one line per setting, keyed by its dotted name. The Settings page's route
# (api/routes/workspace.py) reads it, and nothing in the engine does. A test holds it complete:
# every setting that the model declares has a line, and no line names one that does not exist.
# `sections` are the page's headings, in the page's order.
#
# `read_by` is the smallest declaration of which rules read a setting. No rule reads the Settings
# object itself, but a predicate can depend on what a setting made the run record. Each entry names
# the predicate and, where it reads the setting only when a parameter is set, that parameter. The
# page links every rule in force that matches.
sections:
  depth: "Reading depth"
  scan: "Listing files"
  hash: "Comparing files"
  extraction: "Reading inside files"
  dictionary: "Reading names"
  journal: "Scan journal"
  listing: "Archive file lists"
  jobs: "Background jobs"
  infer: "Applying the rules"
  completeness: "Completeness and no analysis found"
  design: "The design grid of an experiment"
  themes: "Themes of experiments"
  questions: "List of checks"
  search: "The search box"
  columns: "Tables with the same columns"
  groups: "How groups are made of words"
settings:
  columns.files_listed: "How many files each list on a table's page names; the count beside the list is always the whole"
  columns.inclusion: "Whether tables are listed whose columns contain another table's columns"
  columns.inclusion_minimum_columns: "Fewest columns a table needs to be listed as contained in another table"
  columns.minimum_columns: "Fewest columns a table needs to be listed as having the same columns as other tables. Used only when the rule for tables with the same columns is off"
  completeness.forgotten_at_least: "Reason 'forgotten': the share of the rest of its theme's raw data found analyzed, at least"
  completeness.judged_from_acquisitions: "How many raw acquisitions an experiment needs found before it can be listed as having no analysis found"
  completeness.listed_below_share: "Ingence lists an experiment under No analysis found when less than this share of its raw files is analyzed"
  completeness.own_analysis_files: "How many analysis files found count as an analysis of the experiment's own"
  completeness.own_result_tables: "How many results tables found count as an analysis of the experiment's own"
  completeness.stopped_below: "Reason 'a line that stopped': the share of the rest of its theme's raw data found analyzed, under"
  depth: "The reading depth when you do not choose one: Quick, Standard or Deep"
  design.cells_listed_at_most: "The most combinations of an experiment's grid listed as not found; a larger grid is counted and not listed"
  design.enabled: "Off by default while it is measured; turn it on to see a grid of the conditions an experiment's names vary"
  design.factor_levels_at_most: "The most values a part of a name may take and still count as a condition. A part with more is an identifier or a frame number"
  design.include_unclassed: "Whether the grid shows a file outside every group of repeats, if its name follows the others' pattern. When on, scripts and documents with similar names make grids too"
  design.merge_exception_share: "The share of an experiment's files that may break the pairing of two parts of a name that go together, such as GFP and 488"
