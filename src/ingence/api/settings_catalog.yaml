  dictionary.domain_skew.minimum_share: "The share of the voting files the leading domain must hold before it decides"
  dictionary.domain_skew.question_above_files: "Above this many files, a word whose domains are evenly matched becomes a question"
  dictionary.files_to_accept_a_pack: "Not read since 0.4.0: Ingence reads every word list and lets your folder's own words decide"
  dictionary.glued_runs: "How letters and digits written together are read: by what leads, as one word, or split"
  dictionary.glued_words.half_minimum: "The fewest letters each part may have when a run of two joined known words is divided"
  dictionary.glued_words.reading: "Whether a run of two known words written together, like channelhoechst, is divided"
  dictionary.key_value_pairs: "How many pairs like sub-01 a name needs before each reads as a numbered label"
  dictionary.packs: "Packs your laboratory installed, which each scan reads, in order"
  dictionary.plural_minimum: "The fewest letters a word needs before it is read as the plural of a known word"
  dictionary.plausible_years: "Older year range for dates in names; kept so old projects load, no longer used"
  dictionary.record_name_shapes: "Whether where each part sat within a name is recorded"
  dictionary.six_digit_dates: "Whether six digits alone are read as a year-month-day date or as a number"
