  dictionary.variants.same_slot_neighbors: "How many words two spellings must have beside them in common to be offered as taking each other's place"
  dictionary.variants.same_slot_words: "How many unknown words, most files first, are compared for taking each other's place"
  dictionary.variants.shown: "How many spellings are offered beside a word, nearest first"
  dictionary.variants.slips: "Whether a word is offered beside a known word it may be a typing slip of"
