  dictionary.variants.initials_minimum_letters: "The fewest letters initials may have to be offered beside a multi-part word"
  dictionary.variants.plurals: "Whether an unknown word and its regular plural are offered as one word"
  dictionary.variants.same_slot: "Whether two spellings that take each other's place in names of nearby folders are offered as possibly one word"
