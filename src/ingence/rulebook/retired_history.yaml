# What every version of the retired rules file held, frozen at the fold. The record holds the rules
# the file declared, the changes it made, the exceptions of its deferral, each rule's shape (its
# declaration less its words and values, as a digest written in letters) and every value it gave a
# parameter, as canonical JSON. The file is rulebook/01-revision-4.yaml, which earlier versions of
# Ingence kept in each project. Its rules are now the engine's own. The record was generated once,
# at the fold, from every version of the declaration that git holds. No version is written after
# it, so it is complete. src/ingence/rulebook/retired.py reads it.
