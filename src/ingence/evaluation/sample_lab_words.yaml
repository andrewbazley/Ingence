# The words of the sample collection, version 2.
#
# Every word a person can read in a name of the collection (a folder, a file, a person) is in this
# file, and nowhere else. There are no invented words. Sections:
#
#   people      ordinary made-up names (a first name and a family name). A test checks that none of
#               them is a word the Dictionary reads.
#   dictionary  words the shipped Dictionary already reads. A test checks that each one is read by
#               the core and the packs named under `packs`, which are the ones a new project
#               (and `ingence demo`) loads, and by no fewer.
#   packs       for the dictionary words the core alone does not read, the one pack that reads
#               them. A test checks that the core alone does not read them and the pack does.
#   biology     common biology words: cell lines, genes and proteins, drugs. Most are not words
#               the Dictionary reads. The packs read the public ones named in the test (HeLa,
#               DMSO and the like), which stay here because the generator picks them by their
#               place in the list. A test pins which of them are read.
#   everyday    plain English words of folder and file names that the Dictionary does not read
#               (a test checks that it does not).
#   files       the extensions of files and the names programs give their own files. The
#               Dictionary reads some of them; nothing is claimed about the rest.
#
# A word with a capital letter is written that way in names where the habit allows it. Matching
# ignores case. A phrase of two words ("western blot") is two words in a name.

