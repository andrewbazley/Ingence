# The format senses as the section files declared them before the file-type table existed.
# There is one key per section, and each entry is as it was read, with comments gone and
# vendor strings taken out of origins. The identity test builds a Dictionary from these
# beside one from the table and compares senses and bindings to the byte.
# Every spelling here is a file extension or a format's own name.
